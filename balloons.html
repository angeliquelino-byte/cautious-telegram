<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Birthday Balloon Challenge</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      background: url('https://www.transparenttextures.com/patterns/parchment.png') repeat;
      text-align: center;
      font-family: 'Cinzel Decorative', cursive;
      color: #4B2E2E;
    }
    h1 {
      margin-top: 40px;
      font-size: 42px;
      color: #8B0000;
      text-shadow: 2px 2px #FFD700;
    }
    .balloon {
      display: inline-block;
      margin: 20px;
      width: 80px;
      height: 110px;
      border-radius: 50%;
      position: relative;
      animation: float 6s ease-in-out infinite;
    }
    .balloon:after {
      content: "";
      position: absolute;
      bottom: -30px;
      left: 50%;
      width: 2px;
      height: 30px;
      background: #333;
    }
    .red { background: radial-gradient(circle at 30% 30%, #FF6347, #8B0000); }
    .green { background: radial-gradient(circle at 30% 30%, #32CD32, #006400); }
    .purple { background: radial-gradient(circle at 30% 30%, #9370DB, #4B0082); }
    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-40px); }
      100% { transform: translateY(0); }
    }
    img {
      margin-top: 20px;
      max-width: 300px;
      border: 4px solid #8B0000;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <h1>🎈 Birthday Balloon Challenge 🎈</h1>
  <div>
    <div class="balloon red"></div>
    <div class="balloon green"></div>
    <div class="balloon purple"></div>
  </div>

  <p>Pop the balloons to reveal surprises!</p>

  <!-- Picture placeholder: swap the src anytime -->
  <img src="your-picture.jpg" alt="Celebration Picture">

  <p>🎉 Happy Birthday and Congratulations! 🎉</p>
</body>
</html>
