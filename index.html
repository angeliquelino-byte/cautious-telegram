<!-- trigger rebuild -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Code Quest Adventure - Question 1</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- Fantasy font -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      background: url('https://i.imgur.com/8w7r1zM.jpg') center/cover no-repeat; /* parchment texture */
      color: #4B2E2E; /* dark brown text */
      text-align: center;
      font-family: 'Cinzel Decorative', cursive;
    }
    h2 {
      margin-top: 50px;
      font-size: 32px;
      color: #8B0000; /* deep red */
      text-shadow: 2px 2px #FFD700; /* gold glow */
    }
    button {
      padding: 12px 24px;
      font-size: 18px;
      cursor: pointer;
      margin-top: 20px;
      background: linear-gradient(#FFD700, #DAA520); /* gold gradient */
      border: 2px solid #8B0000;
      border-radius: 8px;
      color: #4B2E2E;
      font-weight: bold;
    }
    button:hover {
      background: linear-gradient(#DAA520, #FFD700);
      transform: scale(1.05);
    }
  </style>
</head>

<body>
  <h2>Question 1</h2>
  <p>What number system uses only 0 and 1?</p>
  <button onclick="checkAnswer()">Answer</button>

  <script>
    function checkAnswer() {
      let answer = prompt("What number system uses only 0 and 1?");
      if(answer.toLowerCase() === "binary") {
        confetti({ particleCount: 200, spread: 70, origin: { y: 0.6 } });
        alert("Correct! 🎉 Moving to next question...");
        window.location.href = "question2.html";
      } else {
        alert("Wrong! Try again.");
      }
    }
  </script>
</body>
</html>
