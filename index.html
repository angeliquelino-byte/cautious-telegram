<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Code Quest Adventure - Question 1</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- Fantasy font -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      background: url('https://i.imgur.com/8w7r1zM.jpg') center/cover no-repeat; /* parchment texture */
      color: #4B2E2E; /* dark brown text */
      text-align: center;
      font-family: 'Cinzel Decorative', cursive;
      font-size: 22px;
    }

    h2 {
      margin-top: 50px;
      font-size: 42px;
      color: #8B0000; /* deep red */
      text-shadow: 2px 2px #FFD700; /* gold glow */
    }

    p {
      font-size: 26px;
      margin-top: 20px;
    }

    button {
      padding: 16px 32px;
      font-size: 22px;
      cursor: pointer;
      margin-top: 20px;
      background: linear-gradient(#FFD700, #DAA520); /* gold gradient */
      border: 3px solid #8B0000;
      border-radius: 10px;
      color: #4B2E2E;
      font-weight: bold;
    }
    button:hover {
      background: linear-gradient(#DAA520, #FFD700);
      transform: scale(1.1);
    }

    .correct {
      margin-top: 20px;
      font-size: 24px;
      color: green;
      font-weight: bold;
      display: none;
    }
  </style>
</head>
<body>
  <h2>QUESTION 1</h2>
  <p>WHAT NUMBER SYSTEM USES ONLY 0 AND 1?</p>
  <button onclick="showCorrect()">Answer</button>
  <div class="correct" id="correctMsg">Correct! It is Binary!</div>

  <script>
    function showCorrect() {
      document.getElementById('correctMsg').style.display = 'block';
      confetti();
    }
  </script>
</body>
</html>
