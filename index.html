<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Code Quest Adventure - Question 1</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      background: url('https://www.transparenttextures.com/patterns/parchment.png') repeat;
      color: #4B2E2E;
      text-align: center;
      font-family: 'Cinzel Decorative', cursive;
      font-size: 22px;
    }
    h2 {
      margin-top: 50px;
      font-size: 42px;
      color: #8B0000;
      text-shadow: 2px 2px #FFD700;
    }
    p { font-size: 26px; margin-top: 20px; }
    input {
      padding: 10px;
      font-size: 20px;
      margin-top: 20px;
      border: 2px solid #8B0000;
      border-radius: 8px;
    }
    button {
      padding: 12px 28px;
      font-size: 22px;
      cursor: pointer;
      margin-top: 20px;
      background: linear-gradient(#FFD700, #DAA520);
      border: 3px solid #8B0000;
      border-radius: 10px;
      color: #4B2E2E;
      font-weight: bold;
    }
    button:hover { background: linear-gradient(#DAA520, #FFD700); transform: scale(1.1); }
    .result { margin-top: 20px; font-size: 24px; font-weight: bold; display: none; }
  </style>
</head>
<body>
  <h2>QUESTION 1</h2>
  <p>WHAT LANGUAGE DO COMPUTERS UNDERSTAND?</p>
  <input type="text" id="answerBox" placeholder="Type your answer here">
  <br>
  <button onclick="checkAnswer()">Submit</button>
  <div class="result" id="resultMsg"></div>

  <script>
    function checkAnswer() {
      const userAnswer = document.getElementById('answerBox').value.trim().toLowerCase();
      const resultMsg = document.getElementById('resultMsg');
      if (userAnswer === "binary") {
        resultMsg.style.display = 'block';
        resultMsg.style.color = 'green';
        // Use innerHTML so the button renders properly
        resultMsg.innerHTML = "Correct! It is Binary! <br><br><a href='question2.html'><button>Next Question</button></a>";
        confetti();
      } else {
        resultMsg.style.display = 'block';
        resultMsg.style.color = 'red';
        resultMsg.textContent = "Oops! Try again.";
      }
    }
  </script>
</body>
</html>
