<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Code Quest Adventure - Success!</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    body {
      background: url('https://i.imgur.com/2JYQZ5U.jpg') center/cover no-repeat;
      color: white;
      text-align: center;
      font-family: 'Trebuchet MS', sans-serif;
    }
    h1 { margin-top: 60px; font-size: 40px; }
    p { font-size: 20px; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>🎉 Congratulations! 🎉</h1>
  <p>You solved all the puzzles!</p>
  <p>Get ready for the next adventure...</p>

  <script>
    // Fire confetti when the page loads
    confetti({ particleCount: 300, spread: 100, origin: { y: 0.6 } });

    // Redirect to balloons.html after 5 seconds
    setTimeout(function() {
      window.location.href = "balloons.html";
    }, 5000);
  </script>
