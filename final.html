<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Code Quest Adventure - Final</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      background: url('https://www.transparenttextures.com/patterns/parchment.png') repeat;
      color: #4B2E2E;
      text-align: center;
      font-family: 'Cinzel Decorative', cursive;
      font-size: 24px;
    }
    h1 {
      margin-top: 80px;
      font-size: 48px;
      color: #8B0000;
      text-shadow: 3px 3px #FFD700;
    }
    p { font-size: 28px; margin-top: 30px; }
    button {
      padding: 14px 32px;
      font-size: 24px;
      cursor: pointer;
      margin: 20px;
      background: linear-gradient(#FFD700, #DAA520);
      border: 3px solid #8B0000;
      border-radius: 12px;
      color: #4B2E2E;
      font-weight: bold;
    }
    button:hover { background: linear-gradient(#DAA520, #FFD700); transform: scale(1.1); }
  </style>
</head>
<body onload="confetti()">
  <h1>🎉 CONGRATULATIONS, ADVENTURER! 🎉</h1>
  <p>YOU HAVE COMPLETED THE CODE QUEST ADVENTURE!</p>

  <!-- Two guaranteed options -->
  <button onclick="window.location.href='index.html'">Play Again</button>
  <button onclick="window.location.href='balloon.html'">Continue</button>
</body>
</html>
