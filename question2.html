<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Code Quest Adventure - Question 2</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    body {
      background: url('https://i.imgur.com/2JYQZ5U.jpg') center/cover no-repeat;
      color: white;
      text-align: center;
      font-family: 'Trebuchet MS', sans-serif;
    }
    h2 { margin-top: 50px; }
    button {
      padding: 12px 24px;
      font-size: 18px;
      cursor: pointer;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h2>Question 2</h2>
  <p>Is the Sun a star?</p>
  <button onclick="checkAnswer()">Answer</button>

  <script>
    function checkAnswer() {
      let answer = prompt("Is the Sun a star?");
      if(answer.toLowerCase() === "yes") {
        confetti({ particleCount: 200, spread: 70, origin: { y: 0.6 } });
        alert("Correct! 🎉 You solved Puzzle 2!");
        window.location.href = "final.html";
      } else {
        alert("Wrong! Try again.");
      }
    }
  </script>
</body>
</html>
