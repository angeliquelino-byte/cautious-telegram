      margin-top: 40px;
      font-size: 42px;
      color: #8B0000;
      text-shadow: 2px 2px #FFD700;
      font-family: 'Cinzel Decorative', cursive;
    }
    .balloon {
      display: inline-block;
      margin: 20px;
      width: 100px;
      height: 130px;
      border-radius: 50%;
      position: relative;
      animation: float 6s ease-in-out infinite;
      cursor: pointer;
    }
    .balloon:after {
      content: "";
      position: absolute;
      bottom: -30px;
      left: 50%;
      width: 2px;
      height: 30px;
      background: #333;
    }
