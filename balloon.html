<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Birthday Balloon Challenge</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
  <style>
    body { text-align:center; font-family:'Comic Neue', cursive; background:#f4e1c1; color:#3b2f2f; position:relative; min-height:100vh; }
    h1 { margin-top:40px; font-size:42px; color:#5c4033; text-shadow:2px 2px #d2b48c; font-family:'Cinzel Decorative', cursive; }
    .balloon { display:inline-block; margin:20px; width:100px; height:130px; border-radius:50%; position:relative; animation:float 6s ease-in-out infinite; cursor:pointer; }
    .balloon:after { content:""; position:absolute; bottom:-30px; left:50%; width:2px; height:30px; background:#333; }
    .red { background:radial-gradient(circle at 30% 30%, #a94442, #5c1a1a); }
    .green { background:radial-gradient(circle at 30% 30%, #3c763d, #1a3b1a); }
    .purple { background:radial-gradient(circle at 30% 30%, #6a5acd, #2f2f6a); }
    @keyframes float { 0%{transform:translateY(0);} 50%{transform:translateY(-40px);} 100%{transform:translateY(0);} }
    .surprise { margin-top:20px; font-size:22px; font-weight:bold; color:#5c4033; display:none; }
    .scatter img { position:absolute; width:150px; border:4px solid #5c4033; border-radius:12px; display:none; }
    .link { margin-top:20px; font-size:20px; display:none; }
    .link a { color:#3c763d; text-decoration:underline; font-weight:bold; }
    button { padding:12px 28px; font-size:20px; cursor:pointer; margin-top:30px; background:linear-gradient(#d2b48c,#a67c52); border:3px solid #5c4033; border-radius:10px; color:#3b2f2f; font-weight:bold; }
    button:hover { background:linear-gradient(#a67c52,#d2b48c); transform:scale(1.1); }
  </style>
</head>
<body>
  <h1>🎈 Birthday Balloon Challenge 🎈</h1>
  <div>
    <div class="balloon red" onclick="showSurprise(1)">
