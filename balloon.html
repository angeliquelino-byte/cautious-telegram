<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Birthday Balloon Challenge</title>
  <style>
    body { text-align:center; font-family:sans-serif; background:#fdf6e3; color:#4B2E2E; }
    .balloon { display:inline-block; margin:20px; width:100px; height:130px; border-radius:50%; cursor:pointer; background:red; }
    .surprise { margin-top:20px; font-size:22px; font-weight:bold; color:#8B0000; display:none; }
    .photos img { max-width:200px; margin:10px; border:2px solid #8B0000; border-radius:8px; display:none; }
    .link { margin-top:20px; font-size:20px; display:none; }
    .link a { color:#006400; text-decoration:underline; font-weight:bold; }
  </style>
</head>
<body>
  <h1>🎈 Balloon Test Page 🎈</h1>
  <p>If you see this, the page is working!</p>

  <div class="balloon" onclick="showSurprise(1)">Balloon 1</div>
  <div class="balloon" onclick="showSurprise(2)">Balloon 2</div>
  <div class="balloon" onclick="showSurprise(3)">Balloon 3</div>

  <p id="surprise1" class="surprise">Balloon 1: You are 31 years old!</p>
  <p id="surprise2" class="surprise">Balloon 2: Here’s a smiling surprise picture!</p>
  <div class="photos">
    <img id="photo1" src="surprise1.jpg" alt="Surprise Photo 1">
    <img id="photo2" src="surprise2.jpg" alt="Surprise Photo 2">
  </div>
  <p id="link2" class="link">👉 <a href="index.html" target="_blank">Go back to start</a></p>
  <p id="surprise3" class="surprise">Balloon 3: The real gift is the adventure!</p>

  <script>
    function showSurprise(num){
      if(num===1){
        document.getElementById('surprise1').style.display="block";
      } else if(num===2){
        document.getElementById('surprise2').style.display="block";
        document.getElementById('photo1').style.display="inline-block";
        document.getElementById('photo2').style.display="inline-block";
        document.getElementById('link2').style.display="block";
      } else if(num===3){
        document.getElementById('surprise3').style.display="block";
      }
    }
  </script>
</body>
</html>
