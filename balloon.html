<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Birthday Balloon Challenge</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      text-align: center;
      font-family: 'Cinzel Decorative', cursive;
      background: #fdf6e3;
      color: #4B2E2E;
    }
    h1 {
      margin-top: 40px;
      font-size: 42px;
      color: #8B0000;
      text-shadow: 2px 2px #FFD700;
    }
    .balloon {
      display: inline-block;
      margin: 20px;
      width: 100px;
      height: 130px;
      border-radius: 50%;
      position: relative;
      animation: float 6s ease-in-out infinite;
      cursor: pointer;
    }
    .balloon:after {
      content: "";
      position: absolute;
      bottom: -30px;
      left: 50%;
      width: 2px;
      height: 30px;
      background: #333;
    }
    .red { background: radial-gradient(circle at 30% 30%, #FF6347, #8B0000); }
    .green { background: radial-gradient(circle at 30% 30%, #32CD32, #006400); }
    .purple { background: radial-gradient(circle at 30% 30%, #9370DB, #4B0082); }
    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-40px); }
      100% { transform: translateY(0); }
    }
    p { font-size: 22px; margin-top: 20px; }
    button {
      padding: 12px 28px;
      font-size: 20px;
      cursor: pointer;
      margin-top: 30px;
      background: linear-gradient(#FFD700, #DAA520);
      border: 3px solid #8B0000;
      border-radius: 10px;
      color: #4B2E2E;
      font-weight: bold;
    }
    button:hover { background: linear-gradient(#DAA520, #FFD700); transform: scale(1.1); }
  </style>
</head>
<body>
  <h1>🎈 Birthday Balloon Challenge 🎈</h1>
  <div>
    <div class="balloon red" onclick="popBalloon(this,1)"></div>
    <div class="balloon green" onclick="popBalloon(this,2)"></div>
    <div class="balloon purple" onclick="popBalloon(this,3)"></div>
  </div>

  <p id="message">Pop the balloons to reveal surprises!</p>

  <!-- Picture placeholder for Balloon 2 -->
  <img id="photo" src="" alt="" style="display:none; max-width:300px; border:4px solid #8B0000; border-radius:12px; margin-top:20px;">

  <p>🎉 Happy Birthday and Congratulations! 🎉</p>

  <button onclick="window.location.href='index.html'">Back to Start</button>

  <script>
    function popBalloon(element, num) {
      // Hide the balloon (simulate popping)
      element.style.display = "none";

      const msg = document.getElementById('message');
      const photo = document.getElementById('photo');

      if (num === 1) {
        msg.textContent = "Balloon 1: 2026 - 1995? You are now 31 years old!";
      } else if (num === 2) {
        msg.textContent = "Balloon 2: Here’s a smiling surprise picture just for you!";
        // Show photo when you add src later
        photo.style.display = "block";
        photo.src = "your-picture.jpg"; // replace with actual image file or URL
      } else if (num === 3) {
        msg.textContent = "Balloon 3: Oops, no gift here… The real gift is the adventure we shared and the ones still to come — Happy Birthday!";
      }
    }
  </script>
</body>
</html>
