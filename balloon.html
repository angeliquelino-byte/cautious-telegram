<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Birthday Balloon Challenge</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
  <style>
    body { text-align:center; font-family:'Comic Neue',cursive; background:#fdf6e3; color:#4B2E2E; }
    h1 { margin-top:40px; font-size:42px; color:#8B0000; text-shadow:2px 2px #FFD700; font-family:'Cinzel Decorative',cursive; }
    .balloon { display:inline-block; margin:20px; width:100px; height:130px; border-radius:50%; position:relative; animation:float 6s ease-in-out infinite; cursor:pointer; }
    .balloon:after { content:""; position:absolute; bottom:-30px; left:50%; width:2px; height:30px; background:#333; }
    .red{background:radial-gradient(circle at 30% 30%,#FF6347,#8B0000);} 
    .green{background:radial-gradient(circle at 30% 30%,#32CD32,#006400);} 
    .purple{background:radial-gradient(circle at 30% 30%,#9370DB,#4B0082);}
    @keyframes float{0%{transform:translateY(0);}50%{transform:translateY(-40px);}100%{transform:translateY(0);}}
    .surprise{margin-top:20px;font-size:22px;font-weight:bold;color:#8B0000;display:none;}
    .photos{margin-top:15px;}
    .photos img{max-width:250px;margin:10px;border:4px solid #8B0000;border-radius:12px;display:none;}
    .link{margin-top:20px;font-size:20px;display:none;}
    .link a{color:#006400;text-decoration:underline;font-weight:bold;}
    button{padding:12px 28px;font-size:20px;cursor:pointer;margin-top:30px;background:linear-gradient(#FFD700,#DAA520);border:3px solid #8B0000;border-radius:10px;color:#4B2E2E;font-weight:bold;}
